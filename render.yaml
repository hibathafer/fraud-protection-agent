# Deploy على Render (مجاني) — يقرأه المنصة تلقائياً
services:
  - type: web
    name: fraud-protection-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COACH_MODE
        value: template
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
